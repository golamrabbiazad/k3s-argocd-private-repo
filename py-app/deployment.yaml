apiVersion: apps/v1
kind: Deployment
metadata:
  name: py-deployment
  labels:
    app: py-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: py-app
  template:
    metadata:
      labels:
        app: py-app
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: py-container
          image: gcr.io/argocd-gitops/py-app:v1
          imagePullPolicy: Always

